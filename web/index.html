<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b1d12">
  <meta name="description" content="Personal channel to Alarisa">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="stylesheet" href="./app.css">
  <title>Alarisa</title>
</head>
<body>
  <main class="app">
    <div class="profile"><img src="./alarisa2-512.webp" alt="Alarisa" class="avatar"></div>
    <header><p class="eyebrow">Personal channel</p><h1>Alarisa</h1></header>
    <section id="auth-panel" class="auth-panel">
      <p id="auth-status" class="status" aria-live="polite" data-status="loading">Checking access…</p>
      <button id="auth-action" type="button" hidden>Sign in with a passkey</button>
    </section>
    <section id="principal-content" hidden>
    <div class="session-actions"><button id="lock-action" type="button" class="secondary">Lock</button></div>
    <section id="signal-status" class="status" aria-live="polite" data-status="ready">Ready to receive your signal.</section>
    <section class="outcome" aria-live="polite" hidden></section>
    <form id="human-signal-form">
      <label for="human-signal">Message to Alarisa</label>
      <textarea id="human-signal" name="text" rows="5" maxlength="4000" required autofocus></textarea>
      <button type="submit">Send</button>
    </form>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
